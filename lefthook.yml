# コミット時に，ステージしたファイルを検査する．
# リポジトリ全体に同じ検査をかけるには，`mise run check`を実行する．
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase

  commands:
    format:
      glob: "*.{ts,mjs,js,json,jsonc,yml,yaml}"
      run: pnpm oxfmt --check --no-error-on-unmatched-pattern {staged_files}
      fail_text: 整形が必要です．`mise run fmt`を実行してください．

    oxlint:
      glob: "*.{ts,mjs,js}"
      run: pnpm oxlint {staged_files}

    textlint:
      glob: "*.md"
      run: pnpm textlint {staged_files}

    markdownlint:
      glob: "*.md"
      run: pnpm markdownlint-cli2 {staged_files}

    mermaid:
      glob: "*.md"
      run: node tools/mermaid/check.mjs {staged_files}
      fail_text: 読めないmermaidの図があります．表示された図を直してください．
