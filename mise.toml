[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
# 版を固定する場合はここで`mise lock`を実行し，生成されたmise.lockもコミットする．

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.fmt]
description = "コードと設定ファイルを整形する"
depends = ["install"]
run = "pnpm fmt"

[tasks.lint]
description = "整形の検査，リント(コード・文書・mermaidの図・Componentの照合)，型検査を実行する"
depends = ["install"]
run = ["pnpm lint", "pnpm typecheck"]

[tasks.test]
description = "すべてのパッケージ(演習用・解答例)のテストを実行する"
depends = ["install"]
run = "pnpm test"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフック)"
depends = ["install", "hooks"]

[tasks.check]
description = "整形の検査，リント，型検査，すべてのパッケージのテストをまとめて実行する"
# lintとtestを並行させると，lintが失敗したときに止め損ねたtestが残り，終わらなくなる．順に実行する．
run = [{ task = "lint" }, { task = "test" }]
