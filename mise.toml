[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
# ここにプロジェクトが使う言語・ツールを追加する(例: node = "24"，rust = "1.98.1")．
# 版を固定する場合はここで`mise lock`を実行し，生成されたmise.lockもコミットする．

# 実際に利用する場合には以下を有効にする
# [settings]
# lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.fmt]
description = "コードと文書を整形する"
depends = ["install"]
run = "echo 'TODO: add your formatter'"

[tasks.lint]
description = "すべてのリントと型検査を実行する"
depends = ["install"]
run = ["pnpm lint", "pnpm typecheck"]

[tasks.test]
description = "単体テストを実行する"
depends = ["install"]
run = "pnpm test"

[tasks.env]
description = ".envがなければ.env.exampleから作る"
run = "test -f .env || cp .env.example .env"

[tasks.laya]
description = "laya-serverをホストで直接起動する(devcontainerを使わない場合)"
depends = ["install"]
run = "pnpm --filter @systemone-handson/laya-server start"

[tasks.triage]
description = "問い合わせを1件振り分ける(例：mise run triage \"件名\" \"本文\")"
depends = ["install"]
run = "pnpm --filter @systemone-handson/triage start"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks", "env"]

[tasks.check]
description = "整形の検査，リント，単体テストなどをまとめて実行する(CIと同じ)"
depends = ["lint", "test"]
